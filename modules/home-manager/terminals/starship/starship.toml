format = """
 [](#fbee78)\
 $os\
 $username\
 [](fg:#fbee78 bg:#FFFFFF)\
 $directory\
 [](fg:#FFFFFF bg:#9C59D1)\
 $git_branch\
 $git_status\
 [](fg:#9C59D1 bg:#2C2C2C)\
 $c\
 $cmake\
 $custom\
 $python\
 $elixir\
 $elm\
 $golang\
 $gradle\
 $haskell\
 $java\
 $julia\
 $nodejs\
 $nim\
 $rust\
 $scala\
 [](fg:#2C2C2C)\
 $docker_context 
 """
 
 
 # Disable the blank line at the start of the prompt
 # add_newline = false
 
 # You can also replace your username with a neat symbol like  or disable this
 # and use the os module below
 [username]
 show_always = true
 style_user = "fg:#000000 bg:#fbee78"
 style_root = "fg:#000000 bg:#fbee78"
 format = '[$user ]($style)'
 disabled = false
 
 # An alternative to the username module which displays a symbol that
 # represents the current operating system
 [os]
 style = "bg:#fbee78"
 disabled = true # Disabled by default
 
 [directory]
 style = "fg:#000000 bg:#ffffff"
 format = "[ $path ]($style)"
 truncation_length = 3
 truncation_symbol = "…/"
 
 # Here is how you can shorten some long paths by text replacement
 # similar to mapped_locations in Oh My Posh:
 [directory.substitutions]
 "Desktop" = ""
 "Documents" = "󰈙"
 "Downloads" = ""
 "Music" = ""
 "Pictures" = ""
 # Keep in mind that the order matters. For example:
 # "Important Documents" = " 󰈙 "
 # will not be replaced, because "Documents" was already substituted before.
 # So either put "Important Documents" before "Documents" or use the substituted version:
 # "Important 󰈙 " = " 󰈙 "
 
 [c]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [cmake]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [custom.cpp]
 detect_extensions = ['cpp', 'cc', 'hpp']
 command = "find src -type f \\( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' \\) | head -n 1"
 when = "find src -type f \\( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' \\) | grep ."
 symbol = ""
 style = "bg:#2C2C2C"
 format = '[ $symbol c++20 ]($style)'
 
 [python]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [docker_context]
 symbol = " "
 style = "bg:#06969A"
 format = '[ $symbol $context ]($style)'
 
 [elixir]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [elm]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [git_branch]
 symbol = ""
 style = "bg:#9C59D1"
 format = '[ $symbol $branch ]($style)'
 
 [git_status]
 style = "bg:#9C59D1"
 format = '[$all_status$ahead_behind ]($style)'
 
 [golang]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [gradle]
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [haskell]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [java]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [julia]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [nodejs]
 symbol = ""
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [nim]
 symbol = "󰆥 "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [rust]
 symbol = ""
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
 
 [scala]
 symbol = " "
 style = "bg:#2C2C2C"
 format = '[ $symbol ($version) ]($style)'
